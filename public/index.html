<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOD Brute‑force Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6">🔐 HOD Login Auditor</h1>
        
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-gray-800 p-4 rounded-lg shadow">
                <div class="text-gray-400 text-sm">Total Examiners</div>
                <div class="text-2xl font-bold" id="totalExaminers">0</div>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg shadow">
                <div class="text-gray-400 text-sm">Successes Found</div>
                <div class="text-2xl font-bold text-green-400" id="successCount">0</div>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg shadow">
                <div class="text-gray-400 text-sm">Current Speed</div>
                <div class="text-2xl font-bold text-blue-400" id="speed">0</div>
                <div class="text-xs text-gray-500">req/sec</div>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg shadow">
                <div class="text-gray-400 text-sm">Status</div>
                <div class="text-xl font-bold" id="statusText">Idle</div>
            </div>
        </div>
        
        <!-- Progress Bar -->
        <div class="bg-gray-800 p-4 rounded-lg shadow mb-6">
            <div class="flex justify-between mb-2">
                <span>Overall Progress</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-4">
                <div class="bg-blue-500 h-4 rounded-full transition-all duration-300" id="progressBar" style="width: 0%"></div>
            </div>
            <div class="text-sm text-gray-400 mt-2" id="currentTask">Waiting...</div>
        </div>
        
        <!-- Control Buttons -->
        <div class="flex gap-3 mb-6">
            <button id="startBtn" class="bg-green-600 hover:bg-green-700 px-6 py-2 rounded-lg font-semibold">▶ Start</button>
            <button id="pauseBtn" class="bg-yellow-600 hover:bg-yellow-700 px-6 py-2 rounded-lg font-semibold">⏸ Pause</button>
            <button id="resumeBtn" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-semibold">⏵ Resume</button>
            <button id="stopBtn" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-semibold">⏹ Stop & Reset</button>
        </div>
        
        <!-- Success Table -->
        <div class="bg-gray-800 rounded-lg shadow overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-700 font-semibold">✅ Found Credentials</div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-700">
                        <tr>
                            <th class="px-4 py-2 text-left">Examiner ID</th>
                            <th class="px-4 py-2 text-left">Password</th>
                            <th class="px-4 py-2 text-left">Time</th>
                        </tr>
                    </thead>
                    <tbody id="successTableBody">
                        <tr><td colspan="3" class="px-4 py-2 text-center text-gray-500">No successes yet</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        let totalExaminers = 0;
        
        socket.on('init', (data) => {
            totalExaminers = data.totalExaminers;
            document.getElementById('totalExaminers').innerText = totalExaminers;
            document.getElementById('successCount').innerText = data.successes.length;
            updateSuccessTable(data.successes);
            if (data.checkpoint) {
                updateProgress(data.checkpoint.examinerIndex, 0);
            }
        });
        
        socket.on('progress', (data) => {
            updateProgress(data.examinerIndex, data.passwordIndex);
            document.getElementById('speed').innerText = data.speed || 0;
            document.getElementById('currentTask').innerHTML = `Current: ${data.currentExaminer || '...'} (password #${data.passwordIndex})`;
        });
        
        socket.on('success', (data) => {
            // Add to table
            const tbody = document.getElementById('successTableBody');
            const row = `<tr class="border-t border-gray-700"><td class="px-4 py-2">${data.examinerId}</td><td class="px-4 py-2">${data.password}</td><td class="px-4 py-2">${new Date(data.time).toLocaleString()}</td></tr>`;
            if (tbody.children[0].innerText.includes('No successes')) {
                tbody.innerHTML = row;
            } else {
                tbody.innerHTML = row + tbody.innerHTML;
            }
            document.getElementById('successCount').innerText = parseInt(document.getElementById('successCount').innerText) + 1;
        });
        
        socket.on('status', (data) => {
            const statusEl = document.getElementById('statusText');
            if (data.running) statusEl.innerHTML = '<span class="text-green-400">Running</span>';
            else if (data.paused) statusEl.innerHTML = '<span class="text-yellow-400">Paused</span>';
            else statusEl.innerHTML = '<span class="text-gray-400">Idle</span>';
        });
        
        function updateProgress(examinerIdx, passwordIdx) {
            const percent = totalExaminers ? (examinerIdx / totalExaminers * 100) : 0;
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressPercent').innerText = `${Math.round(percent)}%`;
        }
        
        function updateSuccessTable(successList) {
            const tbody = document.getElementById('successTableBody');
            if (!successList.length) return;
            tbody.innerHTML = successList.map(s => `<tr class="border-t border-gray-700"><td class="px-4 py-2">${s.examinerId}</td><td class="px-4 py-2">${s.password}</td><td class="px-4 py-2">${new Date(s.time).toLocaleString()}</td></tr>`).join('');
        }
        
        document.getElementById('startBtn').onclick = () => socket.emit('start');
        document.getElementById('pauseBtn').onclick = () => socket.emit('pause');
        document.getElementById('resumeBtn').onclick = () => socket.emit('resume');
        document.getElementById('stopBtn').onclick = () => socket.emit('stop');
    </script>
</body>
</html>
